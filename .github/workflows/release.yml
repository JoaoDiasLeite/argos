# Builds the Windows installer and the Linux AppImage and publishes them to
# GitHub Releases whenever a version tag (v0.3.0, v1.0.0, …) is pushed. The tag
# must match the "version" in package.json — latest.yml and latest-linux.yml
# (the auto-update feeds) are generated from package.json.
#
# electron-builder runs with --publish never: its own GitHub publisher races
# parallel asset uploads and creates duplicate releases. Each OS builds in its
# own job and hands its files over as a workflow artifact; a single
# action-gh-release step then uploads everything to one release.
name: Release

on:
  push:
    tags:
      - 'v*'

# The build jobs only read the repository; only the publish job may write
# (it creates the release and uploads the installers).
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            files: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run package -- --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
