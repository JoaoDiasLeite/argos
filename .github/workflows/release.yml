# Builds the Windows installer, the Linux AppImage and the macOS dmg (Apple
# Silicon) and publishes them to GitHub Releases whenever a version tag (v0.3.0,
# v1.0.0, …) is pushed. The tag must match the "version" in package.json —
# latest.yml, latest-linux.yml and latest-mac.yml (the update feeds) are
# generated from package.json.
#
# The macOS build is ad-hoc signed, not signed with an Apple Developer ID nor
# notarized: Gatekeeper asks for "Open Anyway" on first launch and the app
# cannot install its own updates (it only says a new version is out). The mac
# leg may fail without holding back the Windows and Linux release.
#
# Run it by hand (workflow_dispatch) to build every installer as workflow
# artifacts without publishing anything — the way to check the mac leg before
# tagging.
#
# electron-builder runs with --publish never: its own GitHub publisher races
# parallel asset uploads and creates duplicate releases. Each OS builds in its
# own job and hands its files over as a workflow artifact; a single
# action-gh-release step then uploads everything to one release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The build jobs only read the repository; only the publish job may write
# (it creates the release and uploads the installers).
permissions:
  contents: read

jobs:
  # Fails the run before anything is built when the tag and package.json disagree: the
  # installer and the update feeds carry package.json's version, the release the tag's.
  check-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

  build:
    needs: check-version
    # A manual run skips check-version (there is no tag to compare); build anyway.
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
            optional: false
          - os: ubuntu-latest
            files: |
              release/*.AppImage
              release/latest-linux.yml
            optional: false
          # Apple Silicon only: npm ci installs the native packages
          # (sherpa-onnx, the Claude SDK binary) for the runner's arch alone.
          - os: macos-latest
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
            optional: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build installer
        run: npm run package -- --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
